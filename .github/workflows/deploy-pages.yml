name: Build and Deploy Planar-MHD v11.4

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends iverilog ghdl texlive-latex-base texlive-latex-extra texlive-science texlive-fonts-recommended
      - name: Sanitize and Build
        run: |
          python3 - << 'EOF'
          import re

          lines = open("build_project_v11_4.py").read().splitlines()
          cleaned = []
          in_code = False
          for line in lines:
              s = line.strip()
              if not in_code:
                  if s.startswith(("import ", "from ", "PROJECT_DIR")):
                      in_code = True
                  else:
                      continue
              if s.startswith("Use code with caution") or s.startswith("```"):
                  continue
              if s.startswith("---") or re.match(r"^\d+\.\s+[A-Z]", s) or s.startswith(("Replace with your exact", "Mirror root GitHub")):
                  cleaned.append("# " + line)
              else:
                  cleaned.append(line)
              if s == "build_archive()":
                  break

          src = "\n".join(cleaned) + "\n"

          # Fix outer triple-quote delimiters on files containing """ docstrings
          for key in ['FILES["hil/hil_verify_v11_3.py"]', 'FILES["audit/formal_grammar_pipeline.py"]']:
              idx = src.find(key)
              if idx != -1:
                  start_q = src.find('= """', idx)
                  next_section = src.find("# ---", idx + 10)
                  if next_section == -1:
                      next_section = src.find("def build_archive", idx + 10)
                  end_q = src.rfind('"""', idx, next_section)
                  if start_q != -1 and end_q != -1 and end_q > start_q:
                      src = src[:start_q] + "= '''" + src[start_q + 5:end_q] + "'''" + src[end_q + 3:]

          # Fix dunder underscores if flattened during copy-paste
          for dunder in ["init", "enter", "exit", "name"]:
              src = re.sub(rf"(?<!_)__{dunder}__(?!_)", f"__{dunder}__", src)
              src = re.sub(rf"\bdef {dunder}\(", f"def __{dunder}__(", src)
          src = src.replace('if name == "main":', 'if __name__ == "__main__":')
          src = src.replace('if __name__ == "main":', 'if __name__ == "__main__":')

          open("build_project_v11_4.py", "w").write(src)
          EOF

          python3 build_project_v11_4.py

          python3 - << 'EOF'
          import re

          # Repair Makefile line-wraps, missing $ prefixes, and tab indentation
          mk = open("PlanarMHD_Master_Blueprint_v11_4/Makefile").read()
          mk = re.sub(r"H\s+I\s+L\s+S\s+C\s+R\s+I\s+P\s+T", "HIL_SCRIPT", mk)
          mk = re.sub(r"(?<!\$)\(([A-Z_]+)\)", r"$(\1)", mk)
          mk = re.sub(r"\n\s+([a-z@\$])", r"\n\t\1", mk)
          open("PlanarMHD_Master_Blueprint_v11_4/Makefile", "w").write(mk)

          # Restore single-element bracket slices if stripped during copy-paste
          hil = open("PlanarMHD_Master_Blueprint_v11_4/hil/hil_verify_v11_3.py").read()
          for a, b in [
              ("fn_code = pdu\n", "fn_code = pdu[0]\n"),
              ("nom_regs =[:count]", "nom_regs = [2500, 5500, 20372, 0][:count]"),
              ("fn_code = body\n", "fn_code = body[0]\n"),
              ("exc_code = body if", "exc_code = body[1] if"),
              ("byte_count = body\n", "byte_count = body[1]\n"),
              ("if body & 0x80:", "if body[0] & 0x80:"),
              ("sf6_bar_abs = regs / 1000.0", "sf6_bar_abs = regs[0] / 1000.0"),
              ("core_temp_c = regs / 100.0", "core_temp_c = regs[1] / 100.0"),
              ("rotor_rpm = regs\n", "rotor_rpm = regs[2]\n"),
          ]:
              hil = hil.replace(a, b)
          open("PlanarMHD_Master_Blueprint_v11_4/hil/hil_verify_v11_3.py", "w").write(hil)

          sim = open("PlanarMHD_Master_Blueprint_v11_4/hil/sim_g01_firm_verify.py").read()
          sim = sim.replace("wave_targets =\n", "wave_targets = [288, 1200, 4200, 6000]\n")
          open("PlanarMHD_Master_Blueprint_v11_4/hil/sim_g01_firm_verify.py", "w").write(sim)

          rtl = open("PlanarMHD_Master_Blueprint_v11_4/rtl/digital_warden_pfb11.v").read()
          for a, b in [
              ("sync_pfb11 | (~sync_tlv) | sync_sf6", "sync_pfb11[1] | (~sync_tlv[1]) | sync_sf6[1]"),
              ("{sync_pfb11, pfb11_analog_in}", "{sync_pfb11[0], pfb11_analog_in}"),
              ("{sync_tlv, tlv3502_wire_or}", "{sync_tlv[0], tlv3502_wire_or}"),
              ("{sync_sf6, sf6_low_in}", "{sync_sf6[0], sf6_low_in}"),
          ]:
              rtl = rtl.replace(a, b)
          open("PlanarMHD_Master_Blueprint_v11_4/rtl/digital_warden_pfb11.v", "w").write(rtl)
          EOF

          cd PlanarMHD_Master_Blueprint_v11_4
          make sim sim-physics audit pdf
      - name: Stage Pages
        run: |
          mkdir -p ./public
          cp PlanarMHD_Master_Blueprint_v11_4/build/PlanarMHD_Master_Blueprint_v11_4.pdf ./public/index.pdf
          cp PlanarMHD_Master_Blueprint_v11_4.zip ./public/
          printf '<html><body style="font-family:sans-serif;background:#0f172a;color:#fff;padding:40px"><h1>Planar-MHD Master Blueprint v11.4</h1><p><a style="color:#38bdf8" href="./index.pdf">View Compiled PDF</a> | <a style="color:#38bdf8" href="./PlanarMHD_Master_Blueprint_v11_4.zip">Download ZIP</a></p></body></html>\n' > ./public/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      - id: deployment
        uses: actions/deploy-pages@v4
