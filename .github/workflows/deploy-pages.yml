name: Build and Deploy Planar-MHD v11.4

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends iverilog ghdl texlive-latex-base texlive-latex-extra texlive-science texlive-fonts-recommended
      - name: Sanitize and Build
        run: |
          python3 - << 'EOF'
          import re
          import textwrap

          lines = open("build_project_v11_4.py").read().splitlines()
          cleaned = []
          in_code = False
          for line in lines:
              s = line.strip()
              if not in_code:
                  if s.startswith(("import ", "from ", "PROJECT_DIR")):
                      in_code = True
                  else:
                      continue
              if s.startswith("def build_archive"):
                  break
              if s.startswith("Use code with caution") or s.startswith("```"):
                  continue
              if s.startswith("---") or re.match(r"^\d+\.\s+[A-Z]", s) or s.startswith(("Replace with your exact", "Mirror root GitHub")):
                  cleaned.append("# " + line)
              else:
                  cleaned.append(line)

          src = "\n".join(cleaned) + "\n"

          for key in ['FILES["hil/hil_verify_v11_3.py"]', 'FILES["audit/formal_grammar_pipeline.py"]']:
              idx = src.find(key)
              if idx != -1:
                  start_q = src.find('= """', idx)
                  next_section = src.find("# ---", idx + 10)
                  if next_section == -1:
                      next_section = len(src)
                  end_q = src.rfind('"""', idx, next_section)
                  if start_q != -1 and end_q != -1 and end_q > start_q:
                      src = src[:start_q] + "= '''" + src[start_q + 5:end_q] + "'''" + src[end_q + 3:]

          src += textwrap.dedent('''
          def build_archive():
              for rel_path, content in FILES.items():
                  full_path = os.path.join(PROJECT_DIR, rel_path)
                  os.makedirs(os.path.dirname(full_path), exist_ok=True)
                  with open(full_path, "w", encoding="utf-8") as f:
                      f.write(content)

              with zipfile.ZipFile(ZIP_NAME, "w", zipfile.ZIP_DEFLATED) as zf:
                  for rel_path in sorted(FILES):
                      full_path = os.path.join(PROJECT_DIR, rel_path)
                      zf.write(full_path, arcname=os.path.join(PROJECT_DIR, rel_path))

              print(f"Created '{PROJECT_DIR}/' and '{ZIP_NAME}' with {len(FILES)} files.")


          if __name__ == "__main__":
              build_archive()
          ''')

          open("build_project_v11_4.py", "w").write(src)
          EOF

          python3 build_project_v11_4.py

          python3 - << 'EOF'
          import textwrap

          makefile_clean = textwrap.dedent("""\
          PROJECT := PlanarMHD_Master_Blueprint_v11_4
          DOC_DIR := docs
          RTL_DIR := rtl
          HIL_DIR := hil
          AUDIT_DIR := audit
          BUILD_DIR := build

          TEX_SRC := $(DOC_DIR)/$(PROJECT).tex
          PDF_OUT := $(BUILD_DIR)/$(PROJECT).pdf
          VLOG_SRC := $(RTL_DIR)/digital_warden_pfb11.v
          TB_SRC := $(RTL_DIR)/tb_digital_warden_pfb11.v
          VHDL_SRC := $(RTL_DIR)/digital_warden_pfb11.vhd
          HIL_SCRIPT := $(HIL_DIR)/hil_verify_v11_3.py
          PHYS_SCRIPT := $(HIL_DIR)/sim_g01_firm_verify.py
          HIL_FLAGS ?= --mock

          PDFLATEX := pdflatex -interaction=nonstopmode -halt-on-error -output-directory=$(BUILD_DIR)
          IVERILOG := iverilog
          GHDL := ghdl
          PYTHON := python3

          .PHONY: all pdf sim sim-physics audit hil clean

          all: pdf sim sim-physics audit hil

          $(BUILD_DIR):
          \tmkdir -p $(BUILD_DIR)

          pdf: $(BUILD_DIR)
          \t$(PDFLATEX) $(TEX_SRC)
          \t$(PDFLATEX) $(TEX_SRC)

          sim: $(BUILD_DIR)
          \t$(IVERILOG) -Wall -o $(BUILD_DIR)/warden_tb.vvp $(VLOG_SRC) $(TB_SRC)
          \tvvp $(BUILD_DIR)/warden_tb.vvp
          \t$(GHDL) -a --std=08 --workdir=$(BUILD_DIR) $(VHDL_SRC)

          sim-physics:
          \t$(PYTHON) $(PHYS_SCRIPT)

          audit:
          \t$(PYTHON) -c "import sys; sys.path.insert(0, '$(AUDIT_DIR)'); import formal_grammar_pipeline as fgp; pipe = fgp.FormalGrammarEnginePipeline(); n = pipe.ingest_latex_claim('N1', r'Each rated node produces \\SI{6.1275}{kW}.', ['6.1275_kW']); assert n.empirical_debt_score <= 1.0; print('[OK] FormalGrammarEnginePipeline verified')"

          hil:
          \t$(PYTHON) $(HIL_SCRIPT) $(HIL_FLAGS)
          """)
          open("PlanarMHD_Master_Blueprint_v11_4/Makefile", "w").write(makefile_clean)

          hil = open("PlanarMHD_Master_Blueprint_v11_4/hil/hil_verify_v11_3.py").read()
          for a, b in [
              ("fn_code = pdu\n", "fn_code = pdu[0]\n"),
              ("nom_regs =[:count]", "nom_regs = [2500, 5500, 20372, 0][:count]"),
              ("fn_code = body\n", "fn_code = body[0]\n"),
              ("exc_code = body if", "exc_code = body[1] if"),
              ("byte_count = body\n", "byte_count = body[1]\n"),
              ("if body & 0x80:", "if body[0] & 0x80:"),
              ("sf6_bar_abs = regs / 1000.0", "sf6_bar_abs = regs[0] / 1000.0"),
              ("core_temp_c = regs / 100.0", "core_temp_c = regs[1] / 100.0"),
              ("rotor_rpm = regs\n", "rotor_rpm = regs[2]\n"),
          ]:
              hil = hil.replace(a, b)
          open("PlanarMHD_Master_Blueprint_v11_4/hil/hil_verify_v11_3.py", "w").write(hil)

          sim = open("PlanarMHD_Master_Blueprint_v11_4/hil/sim_g01_firm_verify.py").read()
          sim = sim.replace("wave_targets =\n", "wave_targets = [288, 1200, 4200, 6000]\n")
          open("PlanarMHD_Master_Blueprint_v11_4/hil/sim_g01_firm_verify.py", "w").write(sim)

          rtl = open("PlanarMHD_Master_Blueprint_v11_4/rtl/digital_warden_pfb11.v").read()
          for a, b in [
              ("sync_pfb11 | (~sync_tlv) | sync_sf6", "sync_pfb11[1] | (~sync_tlv[1]) | sync_sf6[1]"),
              ("{sync_pfb11, pfb11_analog_in}", "{sync_pfb11[0], pfb11_analog_in}"),
              ("{sync_tlv, tlv3502_wire_or}", "{sync_tlv[0], tlv3502_wire_or}"),
              ("{sync_sf6, sf6_low_in}", "{sync_sf6[0], sf6_low_in}"),
          ]:
              rtl = rtl.replace(a, b)
          open("PlanarMHD_Master_Blueprint_v11_4/rtl/digital_warden_pfb11.v", "w").write(rtl)
          EOF

          cd PlanarMHD_Master_Blueprint_v11_4
          make sim sim-physics audit hil pdf
      - name: Stage Pages
        run: |
          mkdir -p ./public
          cp PlanarMHD_Master_Blueprint_v11_4/build/PlanarMHD_Master_Blueprint_v11_4.pdf ./public/index.pdf
          cp PlanarMHD_Master_Blueprint_v11_4.zip ./public/
          printf '<html><body style="font-family:sans-serif;background:#0f172a;color:#fff;padding:40px"><h1>Planar-MHD Master Blueprint v11.4</h1><p><a style="color:#38bdf8" href="./index.pdf">View Compiled PDF</a> | <a style="color:#38bdf8" href="./PlanarMHD_Master_Blueprint_v11_4.zip">Download ZIP</a></p></body></html>\n' > ./public/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      - id: deployment
        uses: actions/deploy-pages@v4
